<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <link href="../css/style.css" rel="stylesheet">
</head>

<body id="paginas_fundo">
    <div class="form-container">
        <form action="#" method="POST">
            <h2>Cadastro de Ongs</h2>
            <div class="form-group">
                <label for="nome">CNPJ:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o CNPJ" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite o  e-mail da ONG" required>
            </div>
            <div class="form-group">
                <label for="celular">Celular ou Telefone:</label>
                <input type="tel" id="celular" name="celular" placeholder="Informe seu celular" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
            </div>
            <div class="form-group">
                <label for="data">Data de Cadastro:</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="botao">Cadastrar</button><br><br>
            <p class="link">Já tem uma conta? <a href="./loginOngs.html">Faça login</a></p>
        </form>
    </div>
</body>

</html>
