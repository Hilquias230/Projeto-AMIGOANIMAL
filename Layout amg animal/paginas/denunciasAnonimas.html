<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amigo Animal</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body id="paginas_fundo">


    <div class="form-container">
        <form action="#" method="POST">
            <h2>Faça Sua Denuncia</h2>
            <div class="anonimo">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Anônimo" required>
                </div>
            </div>
            <div class="form-group">
                <label for="localizacao">Localização:</label>
                <input type="text" id="localizacao" name="localizacao" placeholder="Informe sua localização" required>
            </div>

            <div class="form-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*" capture="environment" required>
            </div>

            <div class="form-group">
                <label for="observacao">Observação:</label>
                <textarea id="observacao" name="observacao" placeholder="Escreva sua observação" required></textarea>
            </div>

            <button type="submit" class="botao">Enviar</button><br>
        </form><br>
        <a class="anoni" href="../index.html">Página principal</a>
    </div>


</body>

</html>
