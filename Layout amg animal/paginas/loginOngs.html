<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ongs</title>
    <link href="../css/style.css" rel="stylesheet">
</head>

<body id="paginas_fundo">
    <div class="form-container">
        <form action="#" method="POST">
            <h2>Login ONGs</h2>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite o email da ONG" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite a senha" required>
            </div>

            <button type="submit" class="botao">Entrar</button><br><br>

            <p class="link">Sua ong não tem uma conta? <a href="cadastroOngs.html">Cadastre-se</a></p>

            <p class="link">Esqueceu a senha? <a href="recuperarConta.html">Clique aqui</a></p>

            <a class="ongs" href="../index.html">Página principal</a>
        </form>
    </div>
</body>

</html>
