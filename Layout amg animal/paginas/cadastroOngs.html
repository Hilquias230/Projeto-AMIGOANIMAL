<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <link href="../css/style.css"  rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <form action="#" method="POST">
            <h2>Cadastro de Ongs</h2>
            <div class="form-group">
                <label for="nome">Cnpj:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o Cnpj" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite o  e-mail da ong" required>
            </div>
            <div class="form-group">
                <label for="data">Data do Cdastro:</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit">Cadastrar</button><br><br>
            <p class="link">Já tem uma conta? <a href="./loginOngs.html">Faça login</a></p>
        </form>
    </div>
</body>
</html>
